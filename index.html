document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

isplay: swap;\n  src: url(\"fb6ffc3b-f904-41d0-8043-a8088ca120c4\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f0bd29b1-cd4b-4fd9-b68f-d591aeabeaa7\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c654658a-ba09-4e46-8972-eeb85beb67ec\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"15dcc101-7e68-46f8-9b98-7f4cebe8f952\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ===== HERETA DENTAL ===== */\n:root{\n  --paper:#FAF7F2;\n  --paper-2:#F4EFE6;\n  --linen:#EDE7DC;\n  --linen-deep:#E5DBCB;\n  --ink:#1F1B17;\n  --ink-soft:#544B41;\n  --muted:#8E8475;\n  --clay:#6F4427;\n  --clay-deep:#523015;\n  --clay-soft:#D9C4AD;\n  --wood:#8A6A4F;\n  --line:rgba(31,27,23,.12);\n  --line-soft:rgba(31,27,23,.07);\n  --serif:'Cormorant Garamond',Georgia,serif;\n  --sans:'Manrope',system-ui,-apple-system,sans-serif;\n  --maxw:1240px;\n  --pad:clamp(20px,5vw,64px);\n}\n\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{scroll-behavior:smooth}\nbody{\n  font-family:var(--sans);\n  color:var(--ink);\n  background:var(--paper);\n  line-height:1.65;\n  -webkit-font-smoothing:antialiased;\n  overflow-x:hidden;\n}\nimg{display:block;max-width:100%}\na{color:inherit;text-decoration:none}\n::selection{background:var(--clay);color:#fff}\n\n/* ---- type ---- */\n.serif{font-family:var(--serif)}\nh1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.04;letter-spacing:-.01em}\n.eyebrow{\n  font-family:var(--sans);font-size:13px;font-weight:600;\n  letter-spacing:.22em;text-transform:uppercase;color:var(--clay-deep);\n}\n.eyebrow.muted{color:var(--muted)}\np{text-wrap:pretty}\n\n/* ---- layout ---- */\n.wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}\nsection{position:relative}\n.sec-pad{padding-top:clamp(80px,11vw,150px);padding-bottom:clamp(80px,11vw,150px)}\n.bg-linen{background:var(--linen)}\n.bg-paper2{background:var(--paper-2)}\n.divider{height:1px;background:var(--line-soft)}\n\n/* ---- buttons ---- */\n.btn{\n  display:inline-flex;align-items:center;gap:.6em;\n  font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:.01em;\n  padding:15px 28px;border-radius:999px;border:1px solid transparent;\n  cursor:pointer;transition:.35s cubic-bezier(.2,.7,.2,1);min-height:48px;white-space:nowrap;\n}\n.btn-primary{background:var(--clay);color:#fff}\n.btn-primary:hover{background:var(--clay-deep);transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(82,48,21,.6)}\n.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}\n.btn-ghost:hover{border-color:var(--ink);background:var(--ink);color:var(--paper)}\n.btn .arrow{transition:transform .35s}\n.btn:hover .arrow{transform:translateX(4px)}\n\n/* ---- header ---- */\n.header{\n  position:fixed;top:0;left:0;right:0;z-index:50;\n  transition:background .4s,box-shadow .4s,padding .4s;\n  padding:22px 0;\n}\n.header.scrolled{background:rgba(250,247,242,.86);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line-soft);padding:14px 0}\n.nav{display:flex;align-items:center;justify-content:space-between;gap:24px}\n.brand{display:flex;align-items:center;gap:11px}\n.brand-mark{height:46px;width:auto;flex:0 0 auto;display:block}\n.header.scrolled .brand-mark{height:40px;transition:height .4s}\n.brand-text{font-family:var(--serif);font-size:23px;letter-spacing:.16em;font-weight:600;line-height:1}\n.brand-text small{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.34em;color:var(--muted);font-weight:600;margin-top:3px}\n.nav-links{display:flex;align-items:center;gap:34px;list-style:none}\n.nav-links a{font-size:14.5px;font-weight:500;color:var(--ink-soft);position:relative;padding:4px 0;transition:color .3s}\n.nav-links a::after{content:\"\";position:absolute;left:0;bottom:0;width:0;height:1.5px;background:var(--clay);transition:width .35s}\n.nav-links a:hover{color:var(--ink)}\n.nav-links a:hover::after{width:100%}\n.nav-cta{display:flex;align-items:center;gap:14px}\n.burger{display:none;flex-direction:column;gap:5px;background:none;border:0;cursor:pointer;padding:8px}\n.burger span{width:24px;height:2px;background:var(--ink);transition:.35s;display:block}\n\n/* mobile drawer */\n.drawer{\n  position:fixed;inset:0;z-index:49;background:var(--paper);\n  transform:translateY(-100%);transition:transform .5s cubic-bezier(.7,0,.2,1);\n  display:flex;flex-direction:column;justify-content:center;padding:var(--pad);\n  visibility:hidden;\n}\n.drawer.open{transform:translateY(0);visibility:visible}\n.drawer a{font-family:var(--serif);font-size:34px;padding:12px 0;border-bottom:1px solid var(--line-soft);transition:color .3s,padding-left .3s}\n.drawer a:hover{color:var(--clay);padding-left:8px}\n.drawer .btn{margin-top:30px;justify-content:center}\n\n/* ---- hero ---- */\n.hero{padding-top:clamp(120px,17vh,180px);padding-bottom:clamp(60px,8vw,110px);position:relative;overflow:hidden}\n.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(30px,5vw,72px);align-items:center}\n.hero h1{font-size:clamp(44px,6.6vw,98px);letter-spacing:-.02em}\n.hero h1 em{font-style:italic;color:var(--clay)}\n.hero .sub{font-size:clamp(16px,1.6vw,19px);color:var(--ink-soft);max-width:30em;margin:26px 0 36px}\n.hero-cta{display:flex;gap:14px;flex-wrap:wrap;align-items:center}\n.hero-rating{display:flex;align-items:center;gap:12px;margin-top:40px;color:var(--ink-soft);font-size:14px}\n.stars{color:var(--clay);letter-spacing:2px;font-size:16px}\n.hero-media{position:relative}\n.hero-media .photo{\n  border-radius:240px 240px 18px 18px;overflow:hidden;aspect-ratio:4/5;\n  box-shadow:0 40px 80px -40px rgba(31,27,23,.45);background:var(--linen-deep);\n}\n.hero-media .photo img{width:100%;height:100%;object-fit:cover}\n.hero-badge{\n  position:absolute;left:-26px;bottom:34px;background:var(--paper);\n  border-radius:18px;padding:18px 22px;box-shadow:0 24px 50px -22px rgba(31,27,23,.4);\n  display:flex;align-items:center;gap:14px;border:1px solid var(--line-soft);\n}\n.hero-badge .num{font-family:var(--serif);font-size:40px;color:var(--clay);line-height:.9}\n.hero-badge .lbl{font-size:12.5px;color:var(--ink-soft);line-height:1.35}\n.hero-blob{position:absolute;width:60vw;height:60vw;max-width:720px;max-height:720px;right:-18%;top:-22%;\n  background:radial-gradient(circle at 50% 50%,rgba(111,68,39,.16),transparent 62%);\n  z-index:-1;animation:breathe 11s ease-in-out infinite}\n@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}\n\n/* ---- section heading ---- */\n.sec-head{max-width:760px;margin-bottom:clamp(44px,6vw,72px)}\n.sec-head.center{margin-left:auto;margin-right:auto;text-align:center}\n.sec-head h2{font-size:clamp(34px,4.6vw,62px);margin-top:18px}\n.sec-head p{margin-top:20px;font-size:17px;color:var(--ink-soft);max-width:54ch}\n.sec-head.center p{margin-left:auto;margin-right:auto}\n\n/* ---- about values ---- */\n.values{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}\n.value{\n  background:var(--paper);border:1px solid var(--line- none\"><rect x=\"9\" y=\"14\" width=\"30\" height=\"22\" rx=\"3\" stroke=\"currentColor\" stroke-width=\"1.8\"><\u002Frect><path d=\"M9 21h30M16 14v-3a3 3 0 013-3h10a3 3 0 013 3v3\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"24\" cy=\"28\" r=\"3.5\" stroke=\"currentColor\" stroke-width=\"1.8\"><\u002Fcircle><\u002Fsvg>\n        <h3>Сучасне обладнання<\u002Fh3>\n        <p>Технології діагностики й лікування, що дають точний, прогнозований результат.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"value reveal d2\">\n        <svg class=\"ico\" viewBox=\"0 0 48 48\" fill=\"none\"><circle cx=\"17\" cy=\"17\" r=\"6\" stroke=\"currentColor\" stroke-width=\"1.8\"><\u002Fcircle><circle cx=\"31\" cy=\"20\" r=\"4.5\" stroke=\"currentColor\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M8 38c0-6 4-10 9-10s9 4 9 10M26 36c0-4.5 2.5-8 6-8s6 3 6 8\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n        <h3>Турбота про всю сім'ю<\u002Fh3>\n        <p>Від дитячого прийому до складної ортопедії — для кожного віку та кожної потреби.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"value reveal d3\">\n        <svg class=\"ico\" viewBox=\"0 0 48 48\" fill=\"none\"><path d=\"M24 7l13 4v11c0 9-5.5 15-13 19-7.5-4-13-10-13-19V11l13-4z\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"24\" cy=\"22\" r=\"4\" stroke=\"currentColor\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M24 26v5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n        <h3>Стерильність та безпека<\u002Fh3>\n        <p>Власний стерилізаційний кабінет і суворий протокол на кожному прийомі.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===== SERVICES ===== -->\n<section class=\"sec-pad\" id=\"services\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow\">П
